[project]
name = "functualize-decision-jev"
version = "0.1.0"
description = "Experimental decision-provider plugin for functualize — proposes a choice through the Jev model service"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Mohammad Hakim Adiprasetya", email = "viltohmyst@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "functualize>=0.1.0,<1.0.0",
]

[project.entry-points."functualize.plugins"]
jev = "functualize_decision_jev:JevPlugin"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
functualize = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/functualize_decision_jev"]
