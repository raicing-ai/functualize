[project]
name = "functualize-bitwarden"
version = "0.2.3"
description = "Bitwarden Secrets Manager provider for functualize"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mohammad Hakim Adiprasetya", email = "viltohmyst@gmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "functualize>=0.1.0,<1.0.0",
    # Bitwarden's own SDK. Chosen over the pure-Python third-party
    # reimplementation because this package decrypts the user's secrets, and
    # that code should be the vendor's. The cost is a Rust binary wheel with
    # no source fallback: Windows/Linux/macOS on x86-64 and ARM64 only, glibc
    # only. A musl (Alpine) or unusual-arch host cannot install this plugin —
    # which is precisely why it is a plugin.
    "bitwarden-sdk>=2.0.0",
]

[project.entry-points."functualize.remote_providers"]
bws = "functualize_bitwarden:SecretsManagerProvider"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
functualize = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/functualize_bitwarden"]
