extend                              = { useDefault = true }
title                               = "functualize gitleaks config"

# Four allowlisted things, each scoped as narrowly as the format allows.
#
# **1. The security-audit skill.** It documents hardcoded-credential
# vulnerabilities by showing a vulnerable→fixed pair, and its "vulnerable" half
# is a fabricated key (`sk-live-…`) next to the joke password `hunter2` — an
# entropy match by construction, since demonstrating the pattern requires
# writing the pattern. Scoped to that one *file* rather than excluding the rule,
# so a real key committed anywhere else still fails the scan.
#
# **2. An example event payload.** `generic-api-key` is an entropy-and-proximity
# heuristic: a word containing `api` near an `=` and a long-enough token.
# `resource="api.tar.gz", duration_ms=1200` matches all three and there is no
# secret in it — it is an argument to `rc.events.emit` in a test. Scoped by
# *line content* rather than by file, which is the narrower of the two: the same
# fixture in another file stays covered, and a different string in this one is
# not exempt.
#
# **3. A vault *path* read back in a test.** Same heuristic, same shape:
# `"deploy.api_token", encryption_key=_KEY` puts a word containing `api` beside
# an `=`. What follows the `=` is the *name of a fixture constant*, not a
# credential — `_KEY` is `b"\x2b" * 32`, declared in the open at the top of the
# file, and `deploy.api_token` is a **config path**: the job `deploy` and its
# field `api_token`. Naming a field is the whole point of the vault's grammar,
# so the pattern is unavoidable wherever the feature is tested.
#
# Scoped by line content, like (2). The real secrets in those tests are the
# `PLAINTEXT-…` fixtures, which carry their own inline `gitleaks:allow` and stay
# individually visible; this exempts the *lookup*, not the value. An actual
# credential assigned to `encryption_key=` would not match, because the regex
# requires the bare identifier `_KEY` and nothing quoted.
#
# **4. A synthetic AEAD key in a frozen test-vector file.** `generic-api-key`
# trips on `"aead_key_b64": "bynR38hMVvgMjbDVyMHoKkork8fVxPPi0cCxopmId2Y="` in
# `tests/vault_remote/vectors.json`: `key` is one of its trigger words, the `:`
# between name and value sits inside its proximity window, and the value is a
# high-entropy base64 token. There is no secret — the token is a *test vector*,
# the deterministic contract between the TypeScript and Python implementations,
# and the file says so: regenerating it is a review-gate event. It cannot be
# renamed or re-keyed to dodge the rule, and the commit that added it is
# history, so the exemption belongs here.
#
# Scoped to this file *and* this line together (`condition = "AND"`, since an
# allowlist entry's paths and regexes otherwise match independently), and only
# for the `generic-api-key` rule: the path anchors the exception to
# `tests/vault_remote/vectors.json`, the regex requires the JSON key
# `aead_key_b64` itself, and `targetRules` leaves other rules' findings on the
# same line visible. Another high-entropy value under a different key in that
# file, or this key's line anywhere else, stays covered.
[[allowlists]]
description = "security-audit skill doc: fabricated sk-live/hunter2 demo pair"
paths = [
  '''\.agents/skills/auditing-python-security/VULNERABILITIES\.md''',
]

[[allowlists]]
description = "event-payload example line: api.tar.gz duration_ms entropy false positive"
regexTarget = "line"
regexes = [
  '''resource="api\.tar\.gz", duration_ms=\d+''',
]

[[allowlists]]
description = "vault field-path lookup line: fixture constant name after encryption_key="
regexTarget = "line"
regexes = [
  '''"[a-z][a-z0-9_.-]*\.(api_token|token|password|credential)", encryption_key=_KEY''',
]

[[allowlists]]
description = "frozen synthetic AEAD test vector, scoped to its file and line"
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "line"
paths = [
  '''^tests/vault_remote/vectors\.json$''',
]
regexes = [
  '''"aead_key_b64": "[A-Za-z0-9+/]{32,}={0,2}"''',
]
