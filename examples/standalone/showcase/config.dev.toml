# NOTE ON VERSION CONTROL: this overlay is committed only because the example
# has to work from a fresh clone, and it holds nothing sensitive. In a real
# project, config.base.toml is the only committed layer — the per-environment
# overlays stay out of git so they can carry local credentials. `func builtin
# scaffold init` emits a .gitignore that enforces exactly that.
#
# DEV overlay — active by default. The environment comes from
# FUNCTUALIZE_ENV > ENVIRONMENT > ENV, defaulting to DEV, so this file is
# merged on top of config.base.toml unless you select another environment.
#
# Try: FUNCTUALIZE_ENV=prod func   → this overlay goes inert and the
# `release` job falls back to the base values (us-east-1, 2 replicas).
[release]
environment = "dev"
region = "us-west-2"
replicas = 1
