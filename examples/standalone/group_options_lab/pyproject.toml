[project]
name = "group-options-lab"
version = "0.1.0"
description = "GroupOptions in every surface — mid-path flags, inheritance, and the TUI panels that render them."
requires-python = ">=3.11"
dependencies = ["functualize[cli]"]

[project.scripts]
glab = "group_options_lab.main:main"

[tool.group-options-lab]
jobs_directories = ["jobs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["group_options_lab"]
