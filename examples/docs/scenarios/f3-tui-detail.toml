[scenario]
name = "f3-tui-detail"
version = 1
description = "Verify Detail screen markers, editing, TOML save, and discard"

[source]
file = "docs/cli/inline-tui.md"
lines = "73-98"
description = "Detail screen markers and keybinding behavior"

requires = []

[[steps]]
engine = "pty"
description = "Enter on field → Detail view with ★/●/— markers"
cwd = "examples/standalone/showcase"
command = "uv run func"
cols = 100
rows = 30
actions = [
  { type = "wait", text = "Type a command", timeout = 30 },
  { type = "send", keys = "ping" },
  { type = "send", keys = "<ctrl+r>" },
  { type = "wait", text = "Config Table", timeout = 10 },
  { type = "send", keys = "<enter>" },
  { type = "wait", text = "Detail", timeout = 10 },
  { type = "snap", label = "detail-markers" },
]

