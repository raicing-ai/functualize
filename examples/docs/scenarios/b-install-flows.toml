[scenario]
name = "b-install-flows"
version = 1
description = "Verify all documented install commands work in clean containers"

[source]
file = "docs/getting-started/installation.md"
lines = "7-54"
description = "Installation methods documented on the installation page"

requires = []

[[steps]]
engine = "docker"
description = "Python 3.11+ check"
image = "python:3.11-slim"
command = "python --version"
expected = { stdout_regex = "Python 3\\.(1[1-9]|[2-9]\\d)", exit_code = 0 }
timeout = 30

[[steps]]
engine = "docker"
description = "pip install functualize[cli] from source"
image = "python:3.11-slim"
volumes = { "." = "/src:ro" }
workdir = "/src"
command = "pip install '.[cli]' 2>&1 && echo 'OK' && functualize --version"
expected = { stdout_contains = "OK", exit_code = 0 }
timeout = 180

[[steps]]
engine = "docker"
description = "pip install functualize (no CLI) and verify no CLI deps"
image = "python:3.11-slim"
volumes = { "." = "/src:ro" }
workdir = "/src"
command = "pip install . 2>&1 && echo 'OK' && python -c 'from functualize.app import FunctualizeApp; print(\"import OK\")'"
expected = { stdout_contains = "import OK", exit_code = 0 }
timeout = 180

[[steps]]
engine = "docker"
description = "pip install functualize[cli] + functualize-mcp from source"
image = "python:3.11-slim"
volumes = { "." = "/src:ro" }
workdir = "/src/plugins/functualize-mcp"
command = "pip install /src[cli] . 2>&1 && echo 'OK' && functualize mcp tools"
expected = { stdout_contains = "OK", exit_code = 0 }
timeout = 240

[[steps]]
engine = "docker"
description = "pip install functualize[cli] + functualize-flow-viz from source"
image = "python:3.11-slim"
volumes = { "." = "/src:ro" }
workdir = "/src/plugins/functualize-flow-viz"
command = "pip install /src[cli] . 2>&1 && echo 'OK' && functualize --version"
expected = { stdout_contains = "OK", exit_code = 0 }
timeout = 240

[[steps]]
engine = "docker"
description = "pip install functualize[cli] + functualize-state + functualize-tasks from source"
image = "python:3.11-slim"
volumes = { "." = "/src:ro" }
workdir = "/src"
command = "pip install '/src[cli]' /src/plugins/functualize-state/ /src/plugins/functualize-tasks/ 2>&1 && echo 'OK' && functualize --version"
expected = { stdout_contains = "OK", exit_code = 0 }
timeout = 240

[[steps]]
engine = "docker"
description = "pip install functualize-ai-pydantic from workspace"
image = "python:3.11-slim"
volumes = { "." = "/src:ro" }
workdir = "/src"
command = "pip install /src/plugins/functualize-ai/ /src/plugins/functualize-ai-pydantic/ 2>&1 && echo 'OK' && python -c 'import functualize_ai; print(\"ai OK\")'"
expected = { stdout_contains = "ai OK", exit_code = 0 }
timeout = 240

# ---------------------------------------------------------------------------
# Runtime-mode detection, per install method.
#
# These settle what static reading cannot. `sys.prefix` is not settable by
# environment, so a detection test running inside pytest can only ever observe
# the one mode the suite happens to run under -- and the original detection
# audit could not verify the pipx signal at all, because no pipx was available
# on the audit host. A container per install method is the only place these are
# real.
# ---------------------------------------------------------------------------

[[steps]]
engine = "docker"
description = "uv tool install detects tool_uv"
image = "python:3.12-slim"
volumes = { "." = "/src:ro" }
workdir = "/src"
command = "pip install uv >/dev/null 2>&1 && uv tool install '/src[cli]' >/dev/null 2>&1 && ~/.local/bin/func builtin self doctor"
expected = { stdout_contains = "tool_uv", exit_code = 0 }
timeout = 420

[[steps]]
engine = "docker"
description = "pipx install detects tool_pipx"
image = "python:3.12-slim"
volumes = { "." = "/src:ro" }
workdir = "/src"
command = "pip install pipx >/dev/null 2>&1 && pipx install '/src[cli]' >/dev/null 2>&1 && ~/.local/bin/func builtin self doctor"
expected = { stdout_contains = "tool_pipx", exit_code = 0 }
timeout = 420

# The ladder's order is binding, and these two steps are what make that
# observable. The *same* bare-pip installation reports `project` from inside a
# directory that declares functualize and `tool_pip` from anywhere else,
# because rung 5 -- the bounded upward walk for a project -- runs before rung 6.
# Asserting only one of them would pass with the rungs swapped.

[[steps]]
engine = "docker"
description = "A bare pip install, seen from outside any project, is tool_pip"
image = "python:3.12-slim"
volumes = { "." = "/src:ro" }
workdir = "/tmp"
command = "pip install --break-system-packages '/src[cli]' >/dev/null 2>&1 || pip install '/src[cli]' >/dev/null 2>&1; cd /tmp && func builtin self doctor"
expected = { stdout_contains = "tool_pip", exit_code = 0 }
timeout = 420

[[steps]]
engine = "docker"
description = "The same installation, seen from inside a project that declares functualize, is project"
image = "python:3.12-slim"
volumes = { "." = "/src:ro" }
workdir = "/src"
command = "pip install --break-system-packages '/src[cli]' >/dev/null 2>&1 || pip install '/src[cli]' >/dev/null 2>&1; cd /src && func builtin self doctor"
expected = { stdout_contains = "project", exit_code = 0 }
timeout = 420

[[steps]]
engine = "docker"
description = "A degraded install refuses to update, with the refusal exit code"
image = "python:3.12-slim"
volumes = { "." = "/src:ro" }
workdir = "/tmp"
command = "pip install --break-system-packages '/src[cli]' >/dev/null 2>&1 || pip install '/src[cli]' >/dev/null 2>&1; cd /tmp; func builtin self update --yes; test $? -eq 3 && echo 'REFUSED-3'"
expected = { stdout_contains = "REFUSED-3", exit_code = 0 }
timeout = 420

[[steps]]
engine = "docker"
description = "A degraded install can still list what extends it"
image = "python:3.12-slim"
volumes = { "." = "/src:ro" }
workdir = "/tmp"
command = "pip install --break-system-packages '/src[cli]' >/dev/null 2>&1 || pip install '/src[cli]' >/dev/null 2>&1; cd /tmp && func builtin plugin list"
expected = { stdout_contains = "format_providers", exit_code = 0 }
timeout = 420
