[scenario]
name = "h-workflow"
version = 1
description = "A real workflow DAG: the gate blocks, `workflow list` says so, resume walks past it"

[source]
file = "docs/cli/workflow.md"
lines = "42-73"
description = "Workflow list, state and resume, against a declared @workflow with a Gate"

requires = []

# Rewritten from `docker` to `shell` (2026-08-29). The previous version
# scaffolded a project inside a container purely to obtain a workflow, then
# declared no `@workflow`, reached no gate and resumed nothing — while
# asserting a sentinel (`WORKFLOW_SETUP_OK`) its own command never printed, so
# it had never passed. `examples/quickstart/step7_workflow/weather.py:56-60`
# already declares a real `@workflow` with `Gate(name="preferences", ...)`, so
# the scenario runs against that instead: no ~480s docker step, non-vacuous by
# construction, and inside CI's `--engine shell` run rather than skipped by it.
#
# Every step asserts the *blocked state* explicitly, never just a zero exit. A
# workflow scenario that only checks "the command ran" passes when the gate
# never engages, which is exactly how the previous one became vacuous.

# A scope id is single-use. `workflow cancel` clears the *scope*, but the
# recorded step results and the answered gate survive it, so re-running under
# the same id replays straight through and never reaches the gate — the
# scenario would pass once and then fail forever. Each run therefore mints a
# fresh id and shares it with the later steps through a file, because every
# step is its own process.
#
# The file lives under `$DOC_VERIFY_SCRATCH`, a directory the runner makes once
# per invocation, not at a fixed `/tmp` path. With a fixed name two concurrent
# runs share one file: this scenario minted an id in step 1 and read the other
# run's id in step 2, which had already been consumed — and a used scope can
# never block again, so step 2 failed with nothing wrong in the doc it cites.
[[steps]]
description = "Mint a scope id for this run — a used one can never block again"
engine = "shell"
cwd = "examples/quickstart/step7_workflow"
command = "echo \"doc-h-workflow-$(date +%s%N)\" > $DOC_VERIFY_SCRATCH/h-workflow-scope && cat $DOC_VERIFY_SCRATCH/h-workflow-scope"
expected = { exit_code = 0, stdout_contains = "doc-h-workflow-" }
timeout = 30

[[steps]]
description = "Running the workflow job BLOCKS at the gate — exit 5, not a failure"
engine = "shell"
cwd = "examples/quickstart/step7_workflow"
command = "func trip-planner --wf-run-id \"$(cat $DOC_VERIFY_SCRATCH/h-workflow-scope)\" --city Tokyo"
expected = { exit_code = 5, stderr_contains = "Blocked: gate 'preferences' in scope" }
timeout = 60

[[steps]]
description = "The first step ran before the gate — the walk reached it, not skipped it"
engine = "shell"
cwd = "examples/quickstart/step7_workflow"
command = "func builtin workflow list | grep \"$(cat $DOC_VERIFY_SCRATCH/h-workflow-scope)\""
expected = { exit_code = 0, stdout_contains = "trip-planner  waiting  gates: preferences" }
timeout = 30

[[steps]]
description = "`workflow show` names the walk position and the pending gate"
engine = "shell"
cwd = "examples/quickstart/step7_workflow"
command = "func builtin workflow show \"$(cat $DOC_VERIFY_SCRATCH/h-workflow-scope)\""
expected = { exit_code = 0, stdout_contains = "preferences" }
timeout = 30

[[steps]]
description = "`workflow answer` records the input and runs nothing"
engine = "shell"
cwd = "examples/quickstart/step7_workflow"
command = "func builtin workflow answer \"$(cat $DOC_VERIFY_SCRATCH/h-workflow-scope)\" preferences --input '{\"budget\": \"mid-range\", \"interests\": [\"food\"]}'"
expected = { exit_code = 0, stdout_contains = "answered" }
timeout = 30

# `answer` records; `resume` advances. Advancing replays the walk: `forecast`
# is already recorded and is skipped, the gate is now answered, and
# `travel_plan` and the epilogue run.
[[steps]]
description = "`--wf-resume` walks PAST the answered gate to the epilogue"
engine = "shell"
cwd = "examples/quickstart/step7_workflow"
command = "func trip-planner --wf-resume \"$(cat $DOC_VERIFY_SCRATCH/h-workflow-scope)\" --city Tokyo"
expected = { exit_code = 0, stderr_contains = "Itinerary for Tokyo complete." }
timeout = 60

[[steps]]
description = "The scope is no longer blocked — the gate was really passed"
engine = "shell"
cwd = "examples/quickstart/step7_workflow"
# Scoped to this run's id, not the whole store. `workflow list` is global, so
# asserting `stdout_not_contains = "blocked"` over all of it failed whenever any
# unrelated blocked scope existed — another run's, or a developer's own. A
# completed scope leaves the listing entirely, so absence is the assertion, and
# `grep` exiting 1 on absence is why the markers are needed.
command = "func builtin workflow list | grep \"$(cat $DOC_VERIFY_SCRATCH/h-workflow-scope)\" && echo STILL_LISTED || echo SCOPE_COMPLETED"
expected = { exit_code = 0, stdout_contains = "SCOPE_COMPLETED", stdout_not_contains = "blocked" }
timeout = 30
