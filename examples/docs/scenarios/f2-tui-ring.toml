[scenario]
name = "f2-tui-ring"
version = 1
description = "Verify command ring navigation and panel cycling"

[source]
file = "docs/testing/tui-command-panel-manual-test.md"
lines = "61-81"
description = "Command ring panels and footer zone behavior"

requires = []

[[steps]]
engine = "pty"
description = "Ctrl+R opens Config Table panel"
cwd = "examples/standalone/showcase"
command = "uv run func"
cols = 100
rows = 30
actions = [
  { type = "wait", text = "Type a command", timeout = 30 },
  { type = "send", keys = "ping" },
  { type = "send", keys = "<ctrl+r>" },
  { type = "wait", text = "Config Table", timeout = 10 },
  { type = "snap", label = "ring-config-table" },
]

[[steps]]
engine = "pty"
