[scenario]
name = "l-secrets"
version = 1
description = "Secret fields: unset vs set vs revealed, a required one, and the decoy that must not mask"

[source]
file = "docs/guides/configuration.md"
lines = "389-414"
description = "Declaring a credential, and what `func builtin env` renders for it"

requires = []

# `secrets_lab` is the fixture this doc block describes. `func builtin env`
# prints to **stdout**, unlike a job's logging.

[[steps]]
description = "Unset: an empty credential reads as empty, never as a mask"
engine = "shell"
cwd = "examples/standalone/secrets_lab"
command = "func builtin env sync"
expected = { exit_code = 0, stdout_contains = "export SYNC_CREDENTIAL=''  # source: default" }
timeout = 30

# Masking an empty value would manufacture the appearance of a configured
# credential — the single question these surfaces exist to answer.
[[steps]]
description = "Set: the value masks, and the source says where it came from"
engine = "shell"
cwd = "examples/standalone/secrets_lab"
command = "SYNC_CREDENTIAL=hunter2-real func builtin env sync"
expected = { exit_code = 0, stdout_contains = "export SYNC_CREDENTIAL='•••'  # source: env" }
timeout = 30

[[steps]]
description = "Set: the real value does not appear anywhere in the default output"
engine = "shell"
cwd = "examples/standalone/secrets_lab"
command = "SYNC_CREDENTIAL=hunter2-real func builtin env sync"
expected = { exit_code = 0, stdout_not_contains = "hunter2-real" }
timeout = 30

[[steps]]
description = "--include-secrets is the deliberate reveal"
engine = "shell"
cwd = "examples/standalone/secrets_lab"
command = "SYNC_CREDENTIAL=hunter2-real func builtin env sync --include-secrets"
expected = { exit_code = 0, stdout_contains = "SYNC_CREDENTIAL=hunter2-real" }
timeout = 30

# The decoy, and the whole point of the lab. `sort_key` matches every
# name-based "is this a secret?" heuristic ever written and is not one.
# A masking scenario that never checks a non-secret cannot tell "detection
# works" from "everything is masked".
[[steps]]
description = "The decoy: `sort_key` matches every name heuristic and must NOT mask"
engine = "shell"
cwd = "examples/standalone/secrets_lab"
command = "SYNC_CREDENTIAL=hunter2-real func builtin env sync"
expected = { exit_code = 0, stdout_contains = "export SYNC_SORT_KEY=created_at" }
timeout = 30

[[steps]]
description = "A required secret with no default reports itself missing, commented out"
engine = "shell"
cwd = "examples/standalone/secrets_lab"
command = "func builtin env report"
expected = { exit_code = 0, stdout_contains = "# REPORT_TOKEN=  # REQUIRED — not set" }
timeout = 30

[[steps]]
description = "A plain value is printed unquoted, and its origin is the source kind"
engine = "shell"
cwd = "examples/standalone/secrets_lab"
command = "func builtin env sync"
expected = { exit_code = 0, stdout_contains = "export SYNC_API_URL=https://api.example.com  # source: file" }
timeout = 30
