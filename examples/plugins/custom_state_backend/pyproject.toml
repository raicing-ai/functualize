[project]
name = "functualize-state-memory"
version = "0.1.0"
description = "Example plugin: an in-memory StoreSubstrate"
requires-python = ">=3.11"
dependencies = [
    "functualize",
]

[project.entry-points."functualize.state_providers"]
memory = "functualize_state_memory:MemoryStatePlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/functualize_state_memory"]

[tool.uv.sources]
functualize = { path = "../../..", editable = true }
