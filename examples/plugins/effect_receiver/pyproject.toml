[project]
name = "functualize-effect-receiver"
version = "0.1.0"
description = "Example plugin: an outbox effect receiver that deduplicates by idempotency key"
requires-python = ">=3.11"
dependencies = [
    "functualize",
]

[project.entry-points."functualize.plugins"]
effect-receiver = "functualize_effect_receiver:EffectReceiverPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/functualize_effect_receiver"]

[tool.uv.sources]
functualize = { path = "../../../", editable = true }
