[project]
name = "functualize-webhook"
version = "0.1.0"
description = "Example plugin: Webhook delivery adapter for functualize"
requires-python = ">=3.11"
dependencies = [
    "functualize",
]

[project.entry-points."functualize.plugins"]
webhook = "functualize_webhook:WebhookAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/functualize_webhook"]

[tool.uv.sources]
functualize = { path = "../../../", editable = true }
