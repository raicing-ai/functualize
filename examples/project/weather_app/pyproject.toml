[project]
name = "weather-app"
version = "0.1.0"
description = "Example: the README Quick Start weather jobs as a scaffolded FunctualizeApp project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "functualize[cli]",
]

[project.scripts]
weather-app = "weather_app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather_app"]

[tool.uv.sources]
functualize = { path = "../../../", editable = true }
