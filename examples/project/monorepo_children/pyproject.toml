[project]
name = "platform-ops"
version = "0.1.0"
description = "Example: monorepo with child projects composed under namespace prefixes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "functualize[cli]",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[project.scripts]
platform-ops = "platform_ops.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_ops"]

[tool.uv.sources]
functualize = { path = "../../../", editable = true }
