[settings]
experimental = true   # required for [hooks]

[env]
_.path = ["./.venv/bin"]

# Knowledge-graph visualization ceiling. graphify collapses graph.html to an
# aggregated community view above this many nodes; the scoped graph is ~8.6k, so
# the stock 5000 default would silently degrade it to unusable blobs.
#
# This MUST be an env var: `.graphifyrc` is read only by `graphify hook install`
# (to bake the export into the git hook), while the exporter itself
# (exporters/html.py `_viz_node_limit`) reads GRAPHIFY_VIZ_NODE_LIMIT and nothing
# else. Setting it here covers every manual `graphify cluster-only` / `label` run,
# from any worktree, because mise resolves config from the repo root rather than
# the current directory.
GRAPHIFY_VIZ_NODE_LIMIT = "12000"

# Deterministic clustering: networkx louvain iterates string-keyed sets whose
# order is randomized per-process by PYTHONHASHSEED, so community assignments
# churn run-to-run and graph.json diffs become noise. Pinning it keeps the
# committed graph reproducible.
PYTHONHASHSEED = "0"

[tools]
python = "3.11"
uv = "latest"

# A venv is built for one absolute path: every console script in .venv/bin has the
# interpreter baked into its shebang. Move or copy a worktree and all of them break,
# with a confusing symptom — `uv run pytest` reports "Failed to spawn: pytest" because
# the kernel cannot find the interpreter the shebang names, while `python -m pytest`
# still works. `uv sync` does not repair it; the venv has to be rebuilt.
#
# `git worktree add` never copies .venv (it is gitignored), so this only happens when a
# worktree directory is moved or copied by something other than git.
[hooks]
enter = '''
for f in .venv/bin/pytest .venv/bin/ruff .venv/bin/func; do
  if [ -f "$f" ]; then
    read -r line < "$f"
    case "$line" in
      "#!$PWD/.venv/"*) ;;
      "#!"*) printf 'mise: .venv was built elsewhere (%s)\n      fix: rm -rf .venv && uv sync --all-extras\n' "${line#\#!}" >&2 ;;
    esac
    break
  fi
done
'''
