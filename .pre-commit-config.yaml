repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Snapshot files are byte-exact expected output, not source. Trimming
      # trailing whitespace inside a stored Textual SVG export makes it differ
      # from what the app regenerates, and the comparison fails — this broke
      # all four test_snapshot_baseline tests once already.
      - id: trailing-whitespace
        exclude: __snapshots__/
      - id: end-of-file-fixer
        exclude: __snapshots__/
      - id: check-yaml
        args: ['--unsafe']
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key

  # Must track the ruff version in uv.lock. When these drift, `pre-commit run
  # --all-files` reports failures the project's own `ruff check` does not — v0.8.6
  # against a 0.15 codebase produced 36 phantom errors and wanted to reformat 132
  # files, none of which were real.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Validates the commit subject against CONTRIBUTING.md § Commit Message
  # Convention. Runs at commit-msg time, so it needs its own hook type:
  #     uv run pre-commit install --hook-type commit-msg
  # `pre-commit install` alone installs only the pre-commit hook and this will
  # silently never run.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # Explicit list rather than the default: the default permits `style`
        # and `chore` variants this project does not use, and omits `ci`, which
        # it does.
        #
        # This checks the type and shape only. It does NOT reject a multi-token
        # scope such as `fix(cli,scaffold):` — constraining that here would mean
        # enumerating every allowed scope, which goes stale. The single-token
        # rule is enforced on the PR title instead, in
        # .github/workflows/pr-title.yml, which is what lands on master.
        args:
          - feat
          - fix
          - docs
          - refactor
          - test
          - perf
          - ci
          - build
          - chore
          - revert
