[project]
name = "functualize"
version = "0.2.3"
description = "A reusable Python CLI framework with auto-discovery, structured run context, layered configuration, and TUI integration"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mohammad Hakim Adiprasetya", email = "viltohmyst@gmail.com" }
]
requires-python = ">=3.11"
keywords = ["cli", "framework", "click", "tui", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    # Encrypts the local secrets vault (ADR-016). Core rather than an extra:
    # `remote_first()` is public API, and a preset whose behaviour depends on
    # whether an optional package happens to be installed is the class of
    # surprise that ADR exists to remove. Cost is the standalone binary across
    # seven build targets, accepted deliberately and measured at checkpoint.
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/raicing-ai/functualize"
Repository = "https://github.com/raicing-ai/functualize"
Issues = "https://github.com/raicing-ai/functualize/issues"
Changelog = "https://github.com/raicing-ai/functualize/blob/master/CHANGELOG.md"

[project.scripts]
functualize = "functualize._cli.main:main"
func = "functualize._cli.main:main"

[project.entry-points."functualize.plugins"]

[project.entry-points."functualize.format_providers"]
toml = "functualize._config.providers.toml:TomlFormatProvider"

[project.entry-points."functualize.vault_key_providers"]
env = "functualize._config.vault_keys:EnvKeyProvider"
keychain = "functualize._config.vault_keys:KeychainKeyProvider"

[project.entry-points."functualize.remote_providers"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "hypothesis>=6.82.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-asyncio>=0.23.0",
    "pexpect>=4.9.0",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    "import-linter>=2.0",
    "invoke>=2.2.0",
    "debugpy>=1.8.21",
    # Not in the `all` extra -- see the comment there: `bitwarden-sdk>=2.0.0`
    # has no musl wheel and no sdist, so shipping it in `all` makes two of the
    # seven build targets unresolvable. It is still a first-party plugin with
    # its own suite, so it belongs in the development environment, and
    # `uv sync --all-extras` keeps installing it from here.
    "functualize-bitwarden",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[project.optional-dependencies]
cli = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "textual>=8.0",
    "textual[syntax]>=8.0",
    "textual-autocomplete>=4.0.0",
]
all = [
    "functualize[cli]",
    "functualize-state",
    "functualize-state-sqlite",
    "functualize-http",
    "functualize-lambda",
    "functualize-inline",
    "functualize-flow-viz",
    "functualize-ai",
    "functualize-ai-pydantic",
    "functualize-tasks",
    "functualize-tasks-local",
    "functualize-mcp",
    # Pulls boto3/botocore (~20MB of wheel). `all` means every plugin, and it
    # is itself opt-in, so the cost lands only on someone who asked for
    # everything -- but it is the one entry here that is not small. Measured
    # at the 7.1 checkpoint.
    "functualize-aws",
    # `functualize-bitwarden` is deliberately NOT here. `bitwarden-sdk>=2.0.0`
    # publishes wheels for glibc, macOS and Windows only, with no sdist, so
    # including it makes `functualize[all]` **unresolvable** on both musl
    # targets -- and `all` is what the standalone binary bakes
    # (PYAPP_PROJECT_FEATURES=all), so the Alpine/distroless binaries could not
    # be built at all. Measured at the 7.1 checkpoint; `uv pip compile
    # --python-platform x86_64-unknown-linux-musl --extra all` fails outright.
    #
    # There is no PEP 508 marker for musl vs glibc, so it cannot be excluded
    # conditionally. The plugin stays first-class and directly installable
    # (`pip install functualize-bitwarden`), which is what the docs already
    # tell people to do; it simply is not part of "everything", because on two
    # of the seven shipped targets it cannot be.
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
functualize-state-sqlite = { workspace = true }
functualize-http = { workspace = true }
functualize-inline = { workspace = true }
functualize-flow-viz = { workspace = true }
functualize-lambda = { workspace = true }
functualize-state = { workspace = true }
functualize-ai = { workspace = true }
functualize-ai-pydantic = { workspace = true }
functualize-tasks = { workspace = true }
functualize-tasks-local = { workspace = true }
functualize-mcp = { workspace = true }
functualize-aws = { workspace = true }
functualize-bitwarden = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/functualize"]

# Agent skills are authored at the repo root (where the skills CLI and a
# Claude Code marketplace look for them) and carried into the wheel so an
# installed functualize can hand an agent the skills for *that* version.
# One source of truth, two consumers. `_cli/skills.py` resolves the packaged
# copy first and falls back to the repo directory for editable installs;
# tests/skills/test_packaging.py asserts this mapping still exists.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "functualize/_skills"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/functualize",
    "skills",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".*", "*.egg", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (property-based / hypothesis, skipped unless --run-slow is passed)",
    "integration: marks tests as integration tests (test plugin loading and cross-module interactions)",
    "perf_budget: marks wall-clock startup budget assertions (skipped under coverage or xdist; see tests/perf/conftest.py)",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Apply ruff's exclusions even when paths are passed explicitly on the command
# line. pre-commit always passes explicit filenames, so without this the excluded
# trees are linted by the hook but not by `ruff check .` — the hook then reports
# hundreds of errors CI never sees.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501", # line too long (handled by formatter)
    "TC003", # Move stdlib import into TYPE_CHECKING block (false positive with runtime usage)
]

[tool.ruff.lint.per-file-ignores]
"src/functualize/_cli/main.py" = ["E402"]  # Intentional: time import before heavy imports for startup timing
# A parallel table of assertion checks: the outer `if` asks whether an assertion
# was requested, the inner whether it failed. Two different questions, and the
# symmetry across the seven blocks is what makes them readable. Collapsing them
# per SIM102 would merge the concepts and wrap every line.
".agents/skills/doc-verify/scripts/run-scenario" = ["SIM102"]

[tool.ruff.lint.isort]
known-first-party = ["functualize"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["functualize"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "functualize"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Peer layers are independent"
type = "independence"
modules = [
    "functualize._discovery",
    "functualize._config",
    "functualize._engine",
    "functualize._plugins",
    "functualize._gate",
]

[[tool.importlinter.contracts]]
name = "Primitives import nothing internal"
type = "forbidden"
source_modules = ["functualize._primitives"]
forbidden_modules = [
    "functualize._events",
    "functualize._discovery",
    "functualize._config",
    "functualize._engine",
    "functualize._plugins",
    "functualize._app",
    "functualize._cli",
]

[[tool.importlinter.contracts]]
name = "Types import nothing internal"
type = "forbidden"
source_modules = ["functualize._types"]
forbidden_modules = [
    "functualize._primitives",
    "functualize._events",
    "functualize._discovery",
    "functualize._config",
    "functualize._engine",
    "functualize._plugins",
    "functualize._app",
    "functualize._cli",
]

[[tool.importlinter.contracts]]
name = "Internal never imports public"
type = "forbidden"
source_modules = [
    "functualize._types",
    "functualize._primitives",
    "functualize._events",
    "functualize._discovery",
    "functualize._config",
    "functualize._engine",
    "functualize._plugins",
    "functualize._app",
]
forbidden_modules = [
    "functualize.app",
    "functualize.job",
    "functualize.plugin",
    "functualize.types",
    "functualize.testing",
    "functualize.workflow",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "_cli uses public API only"
type = "forbidden"
source_modules = ["functualize._cli"]
forbidden_modules = [
    "functualize._types",
    "functualize._primitives",
    "functualize._events",
    "functualize._discovery",
    "functualize._config",
    "functualize._engine",
    "functualize._plugins",
    "functualize._app",
]
allow_indirect_imports = true
