# Scenario template — copy to examples/docs/scenarios/<name>.toml

# ---------- METADATA ----------
[scenario]
name = "installation"
version = 1
description = "Verify pip install from source works in a clean container"

# ---------- SOURCE TRACEABILITY ----------
# This is the anchor: maps the scenario back to the doc it verifies.
# If the doc moves or the line numbers shift, update this block.
[source]
file = "docs/getting-started/installation.md"
lines = "22-24"
description = "pip install and verify --version"
# Optional: specific code block identifier (for docs with multiple code blocks)
# block = "uv-recommended"   # the tab/fence label or heading preceding the block

# ---------- DEPENDENCIES ----------
# Scenarios this one depends on (they must run first, e.g. build-wheel)
requires = []

# ---------- ENVIRONMENT ----------
# Global env vars for all steps
[env]
# FOO = "bar"

# ---------- STEPS ----------

# --- Step 1: Build the wheel (shell, host) ---
[[steps]]
engine = "shell"
description = "Build wheel from source"
command = "uv build --wheel --out-dir /tmp/doc-verify-dist"
timeout = 60
expected = { exit_code = 0 }

# --- Step 2: Install in clean container ---
[[steps]]
engine = "docker"
description = "Install from wheel and verify --version"
image = "python:3.11-slim"
# Mount the built wheel into the container
volumes = { "/tmp/doc-verify-dist" = "/dist:ro" }
command = """
  pip install /dist/*.whl &&
  functualize --version
"""
expected = { stdout_contains = "functualize", exit_code = 0 }
timeout = 120

# --- Step 3: Verify func alias works too ---
[[steps]]
engine = "docker"
description = "func alias also works"
image = "python:3.11-slim"
volumes = { "/tmp/doc-verify-dist" = "/dist:ro" }
command = """
  pip install /dist/*.whl &&
  func --help
"""
expected = { stdout_regex = "(?i)usage:", exit_code = 0 }
timeout = 120

