name: Release to PyPI

on:
  push:
    tags:
      - "v*"

  # Lets the publish path be exercised without creating a tag. A trusted
  # publisher is keyed on (owner, repo, workflow, environment) — the trigger
  # is not part of that tuple, so a manual run mints exactly the token a tag
  # push would, and proves every project's publisher is configured. The upload
  # itself is a no-op whenever the version is already on the index.
  workflow_dispatch:

jobs:
  # A tag push does not run CI: ci.yml triggers on pushes to master and on
  # pull requests, not on tags. The tagged commit has therefore already been
  # through CI as part of landing on master — this job finds that run and
  # refuses to publish unless it went green.
  #
  # Without it the workflow will happily publish a tag placed on a red commit,
  # and PyPI has no unpublish: a bad version is burned, not fixed. The check
  # is skipped for workflow_dispatch, which has no tag and publishes nothing
  # new (see the note on skip-existing below).
  verify-ci:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
    steps:
      - name: Require a green CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Generous: the slow tier alone takes 20-24 min on GitHub runners,
          # so a tag pushed straight after a merge has to wait for the run
          # that merge started rather than race it.
          deadline=$(( SECONDS + 45 * 60 ))
          while :; do
            runs=$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion}]')

            if [ "$(echo "$runs" | jq 'length')" -eq 0 ]; then
              echo "No CI run found for $SHA."
              echo "A v* tag must point at a commit that has been through CI on master."
              exit 1
            fi

            # Any completed+successful run for this commit satisfies the gate.
            if echo "$runs" | jq -e \
              'any(.[]; .status == "completed" and .conclusion == "success")' > /dev/null; then
              echo "CI is green for $SHA."
              exit 0
            fi

            # A finished-but-not-successful run is terminal; do not wait it out.
            if echo "$runs" | jq -e \
              'all(.[]; .status == "completed")' > /dev/null; then
              echo "CI for $SHA completed without success:"
              echo "$runs" | jq -c '.[]'
              echo "Refusing to publish. Fix master, then move the release to a green commit."
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for CI on $SHA to finish."
              exit 1
            fi
            echo "CI still running for $SHA; checking again in 30s."
            sleep 30
          done

  build:
    needs: verify-ci
    # verify-ci is skipped on workflow_dispatch (no tag). A skipped dependency
    # would otherwise skip this job too, so accept success-or-skipped and let
    # a real failure stop the release.
    if: always() && (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      # Builds the core package plus every workspace plugin (plugins/*)
      # into dist/ — all of them are published to PyPI together below.
      - name: Build all workspace packages
        run: uv build --all-packages

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # NOTE: every package name in dist/ (functualize + functualize-* plugins)
      # must have a PyPI "trusted publisher" configured for this repository and
      # workflow, plus the `pypi` GitHub environment. See plugins/PUBLISHING.md.
      #
      # skip-existing tolerates artifacts already on the index instead of failing
      # the job. It is needed because the twelve projects cannot be bootstrapped
      # by this workflow: a *pending* publisher is unique on
      # (owner, repo, workflow, environment), so one workflow can claim exactly
      # one not-yet-existing project name. The projects are therefore created by
      # a one-time token upload and given ordinary trusted publishers afterwards
      # — which leaves the first tag's artifacts already published when this job
      # runs. See https://github.com/pypi/warehouse/issues/16920.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    # Only a tag push is a release. A manual verification run has no tag for
    # the release notes to point at, so creating one there would be wrong.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
