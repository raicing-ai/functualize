name: Release to PyPI

on:
  push:
    tags:
      - "v*"

  # Lets the publish path be exercised without creating a tag. A trusted
  # publisher is keyed on (owner, repo, workflow, environment) — the trigger
  # is not part of that tuple, so a manual run mints exactly the token a tag
  # push would, and proves every project's publisher is configured. The upload
  # itself is a no-op whenever the version is already on the index.
  workflow_dispatch:

jobs:
  # A tag push does not run CI: ci.yml triggers on pushes to master and on
  # pull requests, not on tags. The tagged commit has therefore already been
  # through CI as part of landing on master — this job finds that run and
  # refuses to publish unless it went green.
  #
  # Without it the workflow will happily publish a tag placed on a red commit,
  # and PyPI has no unpublish: a bad version is burned, not fixed. The check
  # is skipped for workflow_dispatch, which has no tag and publishes nothing
  # new (see the note on skip-existing below).
  verify-ci:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
    steps:
      - name: Require a green CI run for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Generous: the slow tier alone takes 20-24 min on GitHub runners,
          # so a tag pushed straight after a merge has to wait for the run
          # that merge started rather than race it.
          deadline=$(( SECONDS + 45 * 60 ))
          while :; do
            runs=$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | {status, conclusion}]')

            if [ "$(echo "$runs" | jq 'length')" -eq 0 ]; then
              echo "No CI run found for $SHA."
              echo "A v* tag must point at a commit that has been through CI on master."
              exit 1
            fi

            # Any completed+successful run for this commit satisfies the gate.
            if echo "$runs" | jq -e \
              'any(.[]; .status == "completed" and .conclusion == "success")' > /dev/null; then
              echo "CI is green for $SHA."
              exit 0
            fi

            # A finished-but-not-successful run is terminal; do not wait it out.
            if echo "$runs" | jq -e \
              'all(.[]; .status == "completed")' > /dev/null; then
              echo "CI for $SHA completed without success:"
              echo "$runs" | jq -c '.[]'
              echo "Refusing to publish. Fix master, then move the release to a green commit."
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for CI on $SHA to finish."
              exit 1
            fi
            echo "CI still running for $SHA; checking again in 30s."
            sleep 30
          done

  build:
    needs: verify-ci
    # verify-ci is skipped on workflow_dispatch (no tag). A skipped dependency
    # would otherwise skip this job too, so accept success-or-skipped and let
    # a real failure stop the release.
    if: always() && (needs.verify-ci.result == 'success' || needs.verify-ci.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      # Builds the core package plus every workspace plugin (plugins/*)
      # into dist/ — all of them are published to PyPI together below.
      - name: Build all workspace packages
        run: uv build --all-packages

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # NOTE: every package name in dist/ (functualize + functualize-* plugins)
      # must have a PyPI "trusted publisher" configured for this repository and
      # workflow, plus the `pypi` GitHub environment. See plugins/PUBLISHING.md.
      #
      # skip-existing tolerates artifacts already on the index instead of failing
      # the job. It is needed because the twelve projects cannot be bootstrapped
      # by this workflow: a *pending* publisher is unique on
      # (owner, repo, workflow, environment), so one workflow can claim exactly
      # one not-yet-existing project name. The projects are therefore created by
      # a one-time token upload and given ordinary trusted publishers afterwards
      # — which leaves the first tag's artifacts already published when this job
      # runs. See https://github.com/pypi/warehouse/issues/16920.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  # ---------------------------------------------------------------------------
  # The standalone binary, in two stages.
  #
  # Recipe B (decision O1): the distribution is *pre-baked* with functualize and
  # every first-party plugin already installed, and PyApp embeds that artifact
  # rather than pip-installing on first run. That is what makes the first launch
  # work with no network at all — the property the binary exists for, and the
  # one `l-standalone-binary.toml` tests with `--network none`.
  #
  # Split in two because they are different kinds of work with different failure
  # modes: bake is "install a wheel into a relocatable Python", binaries is "run
  # a Rust build over that". A bake failure names the platform whose dependency
  # tree broke; a binaries failure names the PyApp build.
  # ---------------------------------------------------------------------------
  bake:
    needs: build
    if: always() && needs.build.result == 'success'
    strategy:
      # One platform's dependency tree breaking must not hide the others. Every
      # target reports for itself.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            libc: gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            libc: gnu
          # musl is not optional. The binary's audience is the ops user with no
          # Python, who is disproportionately on Alpine or in a container where
          # glibc is absent -- a gnu-only release misses them precisely.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            libc: musl
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            libc: musl
          # `macos-15-intel`, not `macos-13`: the macOS 13 image was retired on
          # 2025-12-04, and a job naming it queues forever rather than failing --
          # which is how a release can look "in progress" for an hour with no
          # runner ever assigned. This is the *last* x86_64 macOS image GitHub
          # will offer; the architecture goes away entirely in August 2027.
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            libc: ""
          - target: aarch64-apple-darwin
            runner: macos-14
            libc: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            libc: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # A python-build-standalone *installation* -- not a virtual environment --
      # with the wheels from `build` installed into it. The recipe lives in
      # `.github/scripts/bake.sh` because the musl targets have to run it inside
      # an Alpine container and two copies of it would drift.
      #
      # musl needs the container because `uv python install` offers only the
      # host libc's distributions: on a glibc runner there is no musl Python to
      # fetch, so a musl binary built here would embed a glibc interpreter.
      - name: Bake the distribution
        shell: bash
        env:
          PYTHON_VERSION: "3.12"
          TARGET: ${{ matrix.target }}
          LIBC: ${{ matrix.libc }}
        run: |
          set -euo pipefail
          # Only a tag names a version. On `workflow_dispatch` the ref name
          # is the *branch* -- "master" is all-alphanumeric and sails past a
          # character-class guard, producing `functualize[all]==master`.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=""
          fi
          case "$version" in
            *[!0-9.a-zA-Z-]*|"") version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2) ;;
          esac
          export FUNCTUALIZE_VERSION="$version"

          if [ "$LIBC" = "musl" ]; then
            docker run --rm \
              -e PYTHON_VERSION -e TARGET -e FUNCTUALIZE_VERSION \
              -v "$PWD:/w" -w /w \
              alpine:3.20 sh .github/scripts/bake.sh
          else
            sh .github/scripts/bake.sh
          fi

      # Archived so the tarball's **root is the distribution root** -- the
      # directory holding `bin/` and `lib/` -- not a wrapper containing it.
      # PyApp's distribution paths are relative to the archive root, and a
      # wrapper means every one of them needs a prefix that is easy to get wrong
      # in exactly one of the two platform branches.
      - name: Archive the baked distribution
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p baked
          tar -czf "baked/functualize-baked-$TARGET.tar.gz" -C "bake/$TARGET" .

      - name: Upload the baked distribution
        uses: actions/upload-artifact@v4
        with:
          name: baked-${{ matrix.target }}
          path: baked/
          retention-days: 1

  binaries:
    needs: bake
    # `always()` without requiring the whole bake matrix to have succeeded.
    # `needs.<matrix-job>.result` is the *aggregate*: one target failing makes it
    # `failure`, which skipped all seven binaries even though six baked fine --
    # `fail-fast: false` buys nothing across a stage boundary. Each binaries job
    # downloads only its own target's artifact and fails by itself if that one is
    # missing, so a broken platform costs its own binary and nothing else.
    if: always() && needs.bake.result != 'cancelled'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: tar.gz
          # `.zip` rather than `.tar.gz`, per platform convention.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # `rustup target add` installs the standard library, never a linker. The
      # musl targets link with `musl-gcc`, which comes from `musl-tools`, and
      # without it cargo fails at the very last step of a ten-minute build.
      - name: Install the musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          # Two spellings, because the two consumers disagree: cargo reads an
          # uppercased `CARGO_TARGET_<TRIPLE>_LINKER`, while the `cc` crate --
          # which any C dependency goes through -- reads `TARGET_CC` verbatim.
          triple=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${triple}_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "TARGET_CC=musl-gcc" >> "$GITHUB_ENV"

      - name: Download the baked distribution
        uses: actions/download-artifact@v4
        with:
          name: baked-${{ matrix.target }}
          path: baked/

      # Every variable is set explicitly (AC25). None is left to an implicit
      # default, because PyApp's defaults are the online recipe: without
      # PYAPP_SKIP_INSTALL and PYAPP_DISTRIBUTION_EMBED the binary would fetch
      # on first run, which is the exact property recipe B exists to remove --
      # and it would still *work* on a networked build machine, so the mistake
      # would ship.
      - name: Build the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PYAPP_PROJECT_NAME: functualize
          PYAPP_PROJECT_FEATURES: all
          PYAPP_EXEC_SPEC: "functualize._cli.main:main"
          PYAPP_DISTRIBUTION_EMBED: "1"
          PYAPP_SKIP_INSTALL: "1"
          PYAPP_UV_ENABLED: "1"
          # Renamed from PyApp's default. Left alone it would expose a working
          # `self` command in standalone mode that exists in no other mode, so
          # the surface would differ by install method. `func pyapp ...` is
          # internal and carries no stability guarantee.
          PYAPP_SELF_COMMAND: pyapp
          PYAPP_FULL_ISOLATION: "1"
          # Makes PyApp set `PYAPP` to the running executable's absolute path
          # rather than the literal "1" (`distribution.rs:54`). That path is the
          # installation's identity: what `self update` replaces, what the
          # registry records, and what `self doctor` reports. Without it the
          # only handle on the binary is `argv[0]`, which PyApp's exec spec
          # makes the literal string `-c`.
          PYAPP_PASS_LOCATION: "1"
          # Must match the interpreter `bake` created, or the site-packages path
          # below points at a directory that does not exist.
          PYAPP_PYTHON_VERSION: "3.12"
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=""
          fi
          case "$version" in
            *[!0-9.a-zA-Z-]*|"") version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2) ;;
          esac
          export PYAPP_PROJECT_VERSION="$version"
          export PYAPP_DISTRIBUTION_PATH="$PWD/baked/functualize-baked-$TARGET.tar.gz"

          # **Both of these are mandatory for a custom embedded distribution**,
          # and they are paths *inside the archive*. PyApp panics at build time
          # without the python path (`build.rs:813`), and silently guesses the
          # site-packages one from its own default layout -- which is not a
          # venv's layout, so a wrong guess yields a binary that starts and then
          # cannot import anything.
          #
          # The archive root is the distribution root (see `bake`). A
          # python-build-standalone install puts `python.exe` at that root --
          # `Scripts/` holds console scripts, not the interpreter -- so the
          # Windows branch is *not* the venv layout it would be for a venv.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PYAPP_DISTRIBUTION_PYTHON_PATH='python.exe'
            export PYAPP_DISTRIBUTION_SITE_PACKAGES_PATH='Lib\site-packages'
          else
            export PYAPP_DISTRIBUTION_PYTHON_PATH="bin/python"
            export PYAPP_DISTRIBUTION_SITE_PACKAGES_PATH="lib/python${PYAPP_PYTHON_VERSION}/site-packages"
          fi

          # Derived from the extension by PyApp, but stated because AC25 means
          # every input is visible in the log rather than inferred.
          export PYAPP_DISTRIBUTION_FORMAT="tar|gzip"

          echo "Build inputs:"
          env | grep '^PYAPP_' | sort

          cargo install pyapp --force --root out --target "$TARGET" --locked

          mkdir -p artifacts
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv "out/bin/pyapp.exe" "artifacts/func.exe"
          else
            mv "out/bin/pyapp" "artifacts/func"
            chmod +x artifacts/func
          fi

      # AC23: the *measured* size, never an estimate. The payload is large by
      # decision O2 -- ~104 MB of dependencies for a genuinely complete offline
      # binary -- and the number staying visible in CI is what keeps that a
      # decision rather than a drift.
      - name: Measure and report the binary size
        shell: bash
        run: |
          set -euo pipefail
          # Not `ls artifacts/func artifacts/func.exe`: exactly one of those
          # names exists on any given platform, `ls` exits non-zero for the
          # other, and under `set -o pipefail` that failed the step *after* a
          # successful ten-minute build.
          if [ -f artifacts/func.exe ]; then
            binary=artifacts/func.exe
          else
            binary=artifacts/func
          fi
          bytes=$(wc -c < "$binary" | tr -d ' ')
          mb=$(( bytes / 1000000 ))
          echo "measured size: ${bytes} bytes (${mb} MB)"
          {
            echo "### \`${{ matrix.target }}\`"
            echo ""
            echo "Measured binary size: **${mb} MB** (${bytes} bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

          # A ceiling, not a target. It exists so a dependency that doubles the
          # payload fails the release rather than shipping quietly.
          limit=$((400 * 1000 * 1000))
          if [ "$bytes" -gt "$limit" ]; then
            echo "Binary is ${mb} MB, over the ${limit} byte ceiling." >&2
            exit 1
          fi
          # And a floor: a build that silently produced a stub would otherwise
          # sail past a size check that only looks upward.
          if [ "$bytes" -lt $((20 * 1000 * 1000)) ]; then
            echo "Binary is only ${mb} MB -- the embedded distribution is missing." >&2
            exit 1
          fi

      - name: Check the binary runs
        shell: bash
        run: |
          set -euo pipefail
          # Not `ls artifacts/func artifacts/func.exe`: exactly one of those
          # names exists on any given platform, `ls` exits non-zero for the
          # other, and under `set -o pipefail` that failed the step *after* a
          # successful ten-minute build.
          if [ -f artifacts/func.exe ]; then
            binary=artifacts/func.exe
          else
            binary=artifacts/func
          fi
          "$binary" builtin version
          "$binary" builtin self doctor || true

      - name: Package the artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "$ARCHIVE" = "zip" ]; then
            (cd artifacts && 7z a "../release/functualize-$TARGET.zip" func.exe)
          else
            tar -czf "release/functualize-$TARGET.tar.gz" -C artifacts func
          fi

      - name: Upload the release artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: release/

  # One job, so the checksum file covers every artifact in one document rather
  # than one file per platform that a user has to assemble themselves.
  checksums:
    needs: binaries
    # Same reasoning: checksum whatever was actually built. A release with six of
    # seven binaries and a checksum file covering those six is strictly better
    # than a release with none -- and the missing platform is visible in the run.
    if: always() && needs.binaries.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Download every binary
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: release/
          merge-multiple: true

      - name: Compute checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/

  github-release:
    needs: [publish, checksums]
    runs-on: ubuntu-latest
    # Only a tag push is a release. A manual verification run has no tag for
    # the release notes to point at, so creating one there would be wrong.
    #
    # **Gated on `publish` alone, not on the binaries.** Without `always()` a
    # failed binary build skips this job, so PyPI would carry the version while
    # GitHub carried a tag and no release at all -- which is what happened on
    # v0.2.0. The wheel is the primary artifact; the binaries ride along, and
    # their absence must not erase the release notes for everyone else.
    if: >-
      always() && needs.publish.result == 'success'
      && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # `continue-on-error`, because the bundle is absent whenever the binary
      # pipeline did not finish. The release itself must still be created.
      - name: Download the release bundle
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-bundle
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Every binary plus the checksum file covering all of them.
          #
          # `fail_on_unmatched_files` is the action's default, stated explicitly
          # because this job now *relies* on it: when the binary pipeline did not
          # finish, `release/` is empty and the release must still be created
          # with its notes.
          fail_on_unmatched_files: false
          files: release/*
