name: Release to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      # Builds the core package plus every workspace plugin (plugins/*)
      # into dist/ — all of them are published to PyPI together below.
      - name: Build all workspace packages
        run: uv build --all-packages

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # NOTE: every package name in dist/ (functualize + functualize-* plugins)
      # must have a PyPI "trusted publisher" configured for this repository and
      # workflow, plus the `pypi` GitHub environment. See plugins/PUBLISHING.md.
      #
      # skip-existing tolerates artifacts already on the index instead of failing
      # the job. It is needed because the twelve projects cannot be bootstrapped
      # by this workflow: a *pending* publisher is unique on
      # (owner, repo, workflow, environment), so one workflow can claim exactly
      # one not-yet-existing project name. The projects are therefore created by
      # a one-time token upload and given ordinary trusted publishers afterwards
      # — which leaves the first tag's artifacts already published when this job
      # runs. See https://github.com/pypi/warehouse/issues/16920.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
