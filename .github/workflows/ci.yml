name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Any branch, on demand: `gh workflow run CI --ref <branch>`. Gives an agent's
  # tip-tier verdict a home that outlives its turn without opening a PR.
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Gate: classify the change into the lane the rest of the workflow runs.
  #
  # Class 1 — the dedicated final cleanup commit. The spec-driven workflow
  # first commits feature artifacts so they are reviewable, runs the full gate
  # set, and only then pushes one cleanup commit deleting those artifacts. That
  # commit clears the two trees the artifact gates refuse —
  # `.spec/features/**` and `contributor/architecture/research/**` — so a
  # deletion-only commit touching either, or both, is the shape recognized
  # here. Only that final deletion-only commit is redundant. Earlier feature
  # commits, ordinary code commits, and a cleanup commit mixed with
  # source/doc changes all run normally.
  #
  # The cleanup class is a property of the head commit alone: inspect the head
  # commit itself, not the range. The parent must have a completed CI run with
  # every validation job green. That run's overall conclusion is red by design
  # because the artifact gates must fail while their trees are still tracked.
  #
  # Class 2 — a no-code diff. A pull request whose whole range touches
  # documentation, workflow YAML or root-level markdown pays for nothing it
  # could fail: lint, imports, types, the fast suite, the three full-suite
  # legs and the four package/example jobs all read code the diff does not
  # touch. `no_code` marks the class and the heavy jobs below resolve
  # `skipped` on it — which GitHub counts as a passing required check.
  # Unlike the cleanup class this one is a property of the whole pull request:
  # a docs commit followed by a code commit must resolve to the code lane, so
  # the range is taken as merge-base(base, head)..head and re-evaluated on
  # every synchronize.
  #
  # The non-code set is a narrow allowlist — `docs/**`,
  # `.github/workflows/**`, root `*.md`, `LICENSE`, `NOTICE` — and anything
  # outside it (pyproject.toml, uv.lock, .github/scripts/**, contributor/**,
  # anything new) fails into the full run. A dependency bump or a CI helper
  # script is not classified, and a classifier that mis-skips tests on a code
  # PR is the one unacceptable outcome; unrecognized means full lane.
  # `.github/workflows/**` is allowlisted but not treated as a no-op: the
  # reduced lane keeps a YAML parse of the workflow files and the docs jobs —
  # a workflow-only PR is the one class where parse and trigger semantics are
  # the change.
  #
  # Missing data — no base sha, an unresolvable merge base, a missing object —
  # leaves every output false, and the gates below fail open into a full run.
  # A workflow-level path filter must never replace this gate: filtered jobs
  # never report a check run, and the required contexts on the master ruleset
  # would deadlock a docs-only PR on "Expected — Waiting for status to be
  # reported". The split exists only as these in-job `if:` conditions.
  # ---------------------------------------------------------------------------
  spec-only-change:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
      no_code: ${{ steps.detect.outputs.no_code }}
      docs_or_workflows: ${{ steps.detect.outputs.docs_or_workflows }}
      workflows_changed: ${{ steps.detect.outputs.workflows_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR head, its parent and the base must all be available.
          fetch-depth: 0

      - name: Detect final artifact cleanup commit and no-code diff
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT_NAME" = pull_request ] && [ -n "$PR_HEAD" ] \
            && git cat-file -e "$PR_HEAD^{commit}" 2>/dev/null; then
            changed="$(git diff-tree --no-commit-id --name-status -r "$PR_HEAD" 2>/dev/null || true)"
          fi

          if [ "${changed:-}" ]; then
            paths="$(printf '%s\n' "$changed" | cut -f2-)"
            deletions="$(printf '%s\n' "$changed" | awk -F '\t' '$1 == "D" {print $2}')"
            if [ -n "$deletions" ] \
              && [ "$(printf '%s\n' "$paths" | wc -l)" -eq "$(printf '%s\n' "$deletions" | wc -l)" ] \
              && ! printf '%s\n' "$deletions" | grep -qvE '^(\.spec/features|contributor/architecture/research)/'; then
              parent_sha="$(git rev-parse "${PR_HEAD}^" 2>/dev/null || true)"
              if [ -n "$parent_sha" ] \
                && python3 .github/scripts/verify_cleanup_predecessor.py "$parent_sha" "$PR_BRANCH"; then
                skip=true
              fi
            fi
          fi

          no_code=false
          docs_or_workflows=false
          workflows_changed=false
          if [ "$EVENT_NAME" = pull_request ] && [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ] \
            && git cat-file -e "$PR_BASE^{commit}" 2>/dev/null \
            && git cat-file -e "$PR_HEAD^{commit}" 2>/dev/null; then
            base="$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || true)"
            if [ -n "$base" ]; then
              pr_files="$(git diff --name-only "$base" "$PR_HEAD" 2>/dev/null || true)"
              if [ -n "$pr_files" ]; then
                if ! printf '%s\n' "$pr_files" | grep -qvE '^(docs/.+|\.github/workflows/.+|[^/]+\.md|LICENSE|NOTICE)$'; then
                  no_code=true
                fi
                printf '%s\n' "$pr_files" | grep -qE '^(docs/|\.github/workflows/)' && docs_or_workflows=true || true
                printf '%s\n' "$pr_files" | grep -qE '^\.github/workflows/' && workflows_changed=true || true
              fi
            fi
          fi

          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "no_code=$no_code" >> "$GITHUB_OUTPUT"
          echo "docs_or_workflows=$docs_or_workflows" >> "$GITHUB_OUTPUT"
          echo "workflows_changed=$workflows_changed" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo "Final artifact cleanup commit (.spec/features/ and/or contributor/architecture/research/) follows green validation; validation jobs will skip."
          elif [ "$no_code" = true ]; then
            echo "No-code pull request: every changed path is docs, workflow YAML or root markdown; heavy validation jobs will skip." >&2
          else
            echo "Full CI run: the range touches code or an unrecognized path, or the class could not be resolved." >&2
          fi

  lint:
    needs: spec-only-change
    # `!cancelled()` keeps a user-cancelled run from restarting the suite;
    # a failed gate leaves `skip` unset, and `!= 'true'` then runs everything.
    #
    # Known edge, and why it is closed: any `if:` here displaces the implicit
    # `success()`, which is what makes the gate fail open — but it also means a
    # *cancelled* run leaves these jobs `skipped` rather than `cancelled`, and
    # GitHub counts `skipped` as a passing required check while `cancelled`
    # blocks. On its own that would let a manual cancel satisfy every gated
    # required context with nothing executed.
    #
    # `spec-only-change` is required by the ruleset for exactly this reason. It
    # carries no `if:`, so a cancelled run reports it `cancelled` and the merge
    # stays blocked however the gated jobs below resolve. Do not add an `if:`
    # to that job, and do not drop it from the ruleset's required contexts —
    # either one silently reopens this.
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check src/ tests/ plugins/ examples/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ plugins/ examples/

  lint-imports:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check import layer contracts
        run: uv run lint-imports

  typecheck:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Mypy
        run: uv run mypy src/

  # Fast feedback: unit tests only, single Python version, no coverage.
  # Finishes quickly to give immediate signal on PRs.
  test-fast:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run fast tests (unit only, no property tests)
        run: uv run pytest

  # The examples are a second product surface: 20 projects a reader is told to
  # run. Nothing executed them until now — `testpaths = ["tests"]`, so a broken
  # example stayed green indefinitely. One did: a plugin file `.gitignore`
  # swallowed, three tests red on every clean clone since it was written.
  #
  # `--all-packages`, not `--all-extras`: the AI and plugin examples import
  # workspace packages.
  examples:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (workspace packages, not just extras)
        run: uv sync --all-packages

      - name: Run example tests
        run: uv run pytest examples/ -v

  # The functualize-mcp plugin's own suites: unit/registration tests plus the
  # examples' live-serve harnesses. The root `testpaths = ["tests"]`
  # (pyproject.toml) never collects plugin tests, and the grouped-job serve
  # crash (F1, `fix/mcp-server-fixes`) shipped precisely because no check ran
  # a live serve. The capability tests in
  # plugins/adapters/functualize-mcp/tests/test_live_serve.py and the grouped_tools
  # example harness are the regression net for it; this job is what keeps
  # that net running.
  plugin-mcp:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (workspace packages, not just extras)
        run: uv sync --all-packages

      - name: Run functualize-mcp plugin tests
        run: uv run pytest plugins/adapters/functualize-mcp/tests -q

      - name: Run functualize-mcp examples
        run: uv run pytest plugins/adapters/functualize-mcp/examples -v

  # The substrate plugin's own suite and its one example.
  #
  # `plugin-taxonomy`/T8 found that `examples/persistent_counter/` imported a
  # `SQLiteStateBackend` defined nowhere in the repository, and that the
  # package README documented five classes where it exports two. Both had been
  # broken for a release, and neither was catchable: the root
  # `testpaths = ["tests"]` never collects a plugin's examples, and the only
  # job that ran any plugin's examples ran functualize-mcp's.
  #
  # A substrate is where a project's data lives, so its example being the
  # published proof that the package works is worth a check that runs it.
  plugin-substrate-sqlite:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (workspace packages, not just extras)
        run: uv sync --all-packages

      - name: Run functualize-substrate-sqlite plugin tests
        run: uv run pytest plugins/substrates/functualize-substrate-sqlite/tests -q

      - name: Run functualize-substrate-sqlite examples
        run: uv run pytest plugins/substrates/functualize-substrate-sqlite/examples -v

  # Every example command this repository publishes, run from a CLEAN CLONE.
  #
  # This closes a class the other jobs structurally cannot see. `055310b` and
  # `7f09be4` were both files that existed on the author's disk and not in git:
  # a plugin implementation, then the config anchor that made the example
  # discoverable. Every job above checks out the working tree and then runs in
  # it, so an untracked file is present for all of them and absent for every
  # user. Both defects were green in CI and broken on `git clone`.
  #
  # `git clone` is the whole mechanism — it copies tracked files only, so a file
  # git never knew about simply is not there. Nothing else in this workflow has
  # that property.
  #
  # Deliberately narrow: the two examples whose READMEs publish a single
  # self-contained command. Widening it to all 20 is worth doing and is a
  # separate change — a guard that is hard to keep green stops being run.
  clean-clone-examples:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git clone` below needs real history, not a tarball export.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Clone tracked files only
        run: git clone --no-hardlinks . "$RUNNER_TEMP/clean"

      - name: Install dependencies in the clone
        working-directory: ${{ runner.temp }}/clean
        run: uv sync --all-packages --all-extras

      # The README publishes exactly one command for this example. It failed
      # with "Unknown command 'greet'" on a clean clone twice.
      # Both streams are captured on purpose. A job's `rc.log(...)` goes to
      # stderr and a plugin's `print()` to stdout, so a stdout-only capture
      # silently drops half of what these commands publish — the showcase
      # assertion below is a `rc.log` line and never appears on stdout at all.
      - name: file_based_plugin — the command its README publishes
        working-directory: ${{ runner.temp }}/clean/examples/plugins/file_based_plugin
        run: |
          set -euo pipefail
          out=$("$RUNNER_TEMP/clean/.venv/bin/func" greet 2>&1)
          echo "$out"
          echo "$out" | grep -q "\[run-notifier\] greet succeeded."

      - name: showcase — the first command its README publishes
        working-directory: ${{ runner.temp }}/clean/examples/standalone/showcase
        run: |
          set -euo pipefail
          out=$("$RUNNER_TEMP/clean/.venv/bin/func" scripts/hello.py greet --name World 2>&1)
          echo "$out"
          echo "$out" | grep -q "Hello, World!"

  # Runs the commands the documentation tells a reader to run, and compares the
  # output against what the docs claim. Shell-engine scenarios only: docker
  # steps run full `pip install` cycles and pty steps drive a real terminal,
  # and `CLAUDE.md` forbids wiring `observe-tui` into CI. Those belong to the
  # release pass.
  #
  # Two preconditions, both of which turn into false doc failures when missed:
  # `.venv/bin` on PATH (or every step exits 127) and the working directory at
  # the repository root (a shell step's `cwd` is process-relative).
  #
  # Fails on ANY non-zero exit. `run-scenario` returns 1 for a failed step and
  # 2 for a scenario it could not load, so gating on 2 alone would pass every
  # real documentation failure through.
  #
  # `--allow-skips` is the deliberate acknowledgement that this job does NOT
  # verify the docker and pty scenarios — 10 of 16, covering installation,
  # scaffold, quickstart, discovery, MCP and the whole TUI surface. Without the
  # flag the run exits 3, because a scenario filtered out by `--engine` runs
  # zero steps and verifies nothing; reporting that as a pass is what let the
  # narrowing go unnoticed. The runner prints every unverified scenario and the
  # tier that owes it, so removing this flag is how you see the gap again.
  # The only owner those tiers actually have today is the manual release gate
  # (`.agents/skills/release/SKILL.md` Phase 4). No scheduled workflow exists.
  doc-verify:
    needs: spec-only-change
    # Same lane condition as docs-build: full lane always; in the no-code lane
    # only when docs or workflow YAML changed, because those are the trees the
    # documented commands read and publish through.
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true' && (needs.spec-only-change.outputs.no_code != 'true' || needs.spec-only-change.outputs.docs_or_workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      # `--all-packages` as well as `--all-extras`: the two prune each other,
      # and `--all-extras` alone installs no workspace member. The shell
      # scenarios import none today, so this was green by luck — the first one
      # to touch an AI or plugin example would have failed on a missing
      # package and been reported as documentation drift, which is the one
      # thing this job must never do. (.spec/STATUS.md finding 11.)
      #
      # `--group docs` is deliberately not here: no scenario runs mkdocs, and
      # the `docs-build` job below owns `mkdocs build --strict` with that group
      # synced. A local run of the whole suite still needs all three at once,
      # as the skill's precondition says.
      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Verify documented commands still behave as documented
        run: |
          PATH="$PWD/.venv/bin:$PATH" python \
            .agents/skills/doc-verify/scripts/run-scenario \
            examples/docs/scenarios/ --engine shell --allow-skips

  # `mkdocs build --strict` ran only on push to master (`docs.yml`), so a PR
  # could break the docs build and only be caught after merge.
  #
  # `--group docs`, not `--all-extras`: mkdocs is not an extra, and a job
  # copying its neighbours here fails on a missing `mkdocs` executable.
  docs-build:
    needs: spec-only-change
    # Runs in the full lane as always. In the no-code lane it runs only when
    # the diff touches docs or workflow YAML — the two allowlisted trees this
    # job can fail on. A root-markdown-only PR skips it: no `mkdocs` input
    # changed.
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true' && (needs.spec-only-change.outputs.no_code != 'true' || needs.spec-only-change.outputs.docs_or_workflows == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install documentation dependencies
        run: uv sync --group docs

      # Workflow YAML only gets parsed by GitHub when one of its own events
      # fires, so a syntax-broken docs.yml or release.yml passes every other
      # check on a workflow-only PR and explodes later, on the push that
      # needed it. Parse every workflow file when the diff touches the tree —
      # in the no-code lane and the full lane alike. Never runs when workflows
      # are untouched, so a pre-existing breakage cannot fail an unrelated PR.
      #
      # `uv run python` after the sync above: mkdocs depends on PyYAML, so the
      # parse needs no runner-image assumption.
      - name: Parse workflow YAML
        if: needs.spec-only-change.outputs.workflows_changed == 'true'
        run: |
          uv run python - <<'EOF'
          import glob
          import sys

          import yaml

          failed = False
          for path in sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml")):
              with open(path) as fh:
                  doc = yaml.safe_load(fh)
              if not isinstance(doc, dict) or not isinstance(doc.get("jobs"), dict):
                  print(f"::error::{path}: not a workflow document (no top-level 'jobs' mapping)")
                  failed = True
                  continue
              print(f"{path}: OK ({len(doc['jobs'])} jobs)")
          sys.exit(1 if failed else 0)
          EOF

      - name: Build documentation
        run: uv run mkdocs build --strict

  # Full suite: property tests + coverage + multi-version + parallel.
  # Thorough validation, runs alongside test-fast.
  test-full:
    needs: spec-only-change
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Explain a skipped validated suite
        if: needs.spec-only-change.outputs.skip == 'true' || needs.spec-only-change.outputs.no_code == 'true'
        run: |
          if [ "${{ needs.spec-only-change.outputs.skip }}" = "true" ]; then
            echo "Prior PR validation was green; skipping the unchanged full suite for Python ${{ matrix.python-version }}."
          else
            echo "The pull request range touches no code; skipping the unchanged full suite for Python ${{ matrix.python-version }}."
          fi

      - uses: actions/checkout@v4
        if: needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'

      - name: Install uv
        if: needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        if: needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        if: needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
        run: uv sync --all-extras

      - name: Run full test suite (property tests + coverage, parallel)
        if: needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest --run-slow --cov=functualize --cov-report=xml -n auto

      - name: Upload coverage
        if: needs.spec-only-change.outputs.skip != 'true' && needs.spec-only-change.outputs.no_code != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  # Feature artifacts under .spec/features/ are committed on the branch so the
  # spec, contracts, plan and task ledger are reviewable, then cleared before
  # merge so master carries none of them. This job is what makes that binding.
  #
  # It runs on pull_request AND on push to master, so the single job is both the
  # blocking PR check and the post-merge master guard. No sparse-checkout:
  # `git ls-files` needs a real index.
  #
  # Deliberately NOT gated by spec-only-change: the clearing push is the one
  # push whose whole content is this job's subject, so skipping it there would
  # skip the only run that ever has something to say.
  #
  # It IS a required context in the `master` ruleset, so a red tick here blocks
  # the merge — which is what .spec/CONSTITUTION.md's tracking exception is
  # granted on the condition of, and what AGENTS.md, .claude/rules/spec-workflow.md,
  # .claude/commands/agentic-verify.md and .claude/agents/spec-driven-developer.md
  # all describe. It was NOT required until 2026-09-09; those five documents
  # asserted a guarantee nothing enforced. Dropping it from the ruleset puts
  # them back to being wrong.
  spec-artifacts-cleared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert .spec/features/ is cleared
        run: |
          tracked=$(git ls-files .spec/features/)
          if [ -n "$tracked" ]; then
            echo "::error::.spec/features/ still has tracked files. Migrate the durable half to .spec/STATUS.md or contributor/adr/, then 'git rm -r .spec/features/<name>' before merging."
            echo "$tracked"
            exit 1
          fi
          echo "OK: .spec/features/ carries no tracked files."

  # The other half of the same rule, and the half that had no gate at all until
  # now. The member decision of 2026-09-22 is that research and handoff documents
  # do not ride a merge: master accumulates neither `.spec/features/**` (the job
  # above) nor `contributor/architecture/research/**` (this one). The second is
  # the one that escaped, and structurally: every FUN-* branch is cut from
  # `docs/runtime-persistence-research`, whose `34455e5` carries the
  # `durability-outsourcing/` and `runtime-persistence-engine-owned/` studies — so
  # 20 files / 5107 lines of research ride a branch that merges code, and nothing
  # in the diff says they are not part of the change. Master tracks no such
  # directory (`git ls-tree -d origin/master contributor/architecture/` lists
  # codemaps, diagrams and run-model), which is why this is a gate and not a
  # review note.
  #
  # Same shape, same reasoning as `spec-artifacts-cleared`: ungated by
  # spec-only-change (the clearing push is the one push whose whole content is
  # this job's subject), on pull_request AND on push to master, and it prints the
  # tracked files — with their count and line total — so a reviewer reads the
  # growth instead of reconstructing the file composition of a long branch.
  #
  # TRANSITIONAL(master ruleset): the job reports on every PR but is not yet a
  # required context, so it is visible without blocking. Registering
  # `research-artifacts-cleared` in the `master` ruleset is a repository-settings
  # change and is what turns it into a gate; AGENTS.md and CONTRIBUTING.md
  # describe it as reported-but-not-required until that lands, and as required
  # once it has.
  research-artifacts-cleared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert contributor/architecture/research/ is cleared
        run: |
          tracked=$(git ls-files contributor/architecture/research/)
          if [ -n "$tracked" ]; then
            files=$(printf '%s\n' "$tracked" | wc -l)
            lines=$(printf '%s\n' "$tracked" | tr '\n' '\0' | xargs -0 wc -l | tail -1 | awk '{print $1}')
            echo "::error::contributor/architecture/research/ still has $files tracked file(s), $lines line(s). That tree does not reach master: migrate the durable half to contributor/reference/ (a citable reference) or contributor/adr/ (a decision), then 'git rm -r contributor/architecture/research/<name>' before merging."
            echo "$tracked"
            exit 1
          fi
          echo "OK: contributor/architecture/research/ carries no tracked files."
