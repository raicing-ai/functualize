name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ---------------------------------------------------------------------------
  # Gate: detect the dedicated final cleanup commit.
  #
  # The spec-driven workflow first commits feature artifacts so they are
  # reviewable, runs the full gate set, and only then pushes one cleanup commit
  # deleting those artifacts. Only that final deletion-only commit is
  # redundant. Earlier feature commits, ordinary code commits, and a cleanup
  # commit mixed with source/doc changes all run normally.
  #
  # On a PR, inspect the head commit itself; base..head includes the whole PR.
  # The parent must have a completed CI run with every validation job green.
  # That run's overall conclusion is red by design because
  # spec-artifacts-cleared must fail while feature artifacts are present.
  # Missing API data fails closed into a full run.
  # ---------------------------------------------------------------------------
  spec-only-change:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR head and its parent must both be available for inspection.
          fetch-depth: 0

      - name: Detect final feature-artifact cleanup commit
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          skip=false
          if [ "$EVENT_NAME" = pull_request ] && [ -n "$PR_HEAD" ] \
            && git cat-file -e "$PR_HEAD^{commit}" 2>/dev/null; then
            changed="$(git diff-tree --no-commit-id --name-status -r "$PR_HEAD" 2>/dev/null || true)"
          fi

          if [ "${changed:-}" ]; then
            paths="$(printf '%s\n' "$changed" | cut -f2-)"
            deletions="$(printf '%s\n' "$changed" | awk -F '\t' '$1 == "D" {print $2}')"
            if [ -n "$deletions" ] \
              && [ "$(printf '%s\n' "$paths" | wc -l)" -eq "$(printf '%s\n' "$deletions" | wc -l)" ] \
              && ! printf '%s\n' "$deletions" | grep -qv '^\.spec/features/'; then
              parent_sha="$(git rev-parse "${PR_HEAD}^" 2>/dev/null || true)"
              if [ -n "$parent_sha" ] \
                && python3 .github/scripts/verify_cleanup_predecessor.py "$parent_sha" "$PR_BRANCH"; then
                skip=true
              fi
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = true ]; then
            echo "Final .spec/features cleanup commit follows green validation; validation jobs will skip."
          else
            echo "Full CI run."
          fi

  lint:
    needs: spec-only-change
    # `!cancelled()` keeps a user-cancelled run from restarting the suite;
    # a failed gate leaves `skip` unset, and `!= 'true'` then runs everything.
    #
    # Known edge, and why it is closed: any `if:` here displaces the implicit
    # `success()`, which is what makes the gate fail open — but it also means a
    # *cancelled* run leaves these jobs `skipped` rather than `cancelled`, and
    # GitHub counts `skipped` as a passing required check while `cancelled`
    # blocks. On its own that would let a manual cancel satisfy every gated
    # required context with nothing executed.
    #
    # `spec-only-change` is required by the ruleset for exactly this reason. It
    # carries no `if:`, so a cancelled run reports it `cancelled` and the merge
    # stays blocked however the gated jobs below resolve. Do not add an `if:`
    # to that job, and do not drop it from the ruleset's required contexts —
    # either one silently reopens this.
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff check
        run: uv run ruff check src/ tests/ plugins/ examples/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ plugins/ examples/

  lint-imports:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check import layer contracts
        run: uv run lint-imports

  typecheck:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Mypy
        run: uv run mypy src/

  # Fast feedback: unit tests only, single Python version, no coverage.
  # Finishes quickly to give immediate signal on PRs.
  test-fast:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run fast tests (unit only, no property tests)
        run: uv run pytest

  # The examples are a second product surface: 20 projects a reader is told to
  # run. Nothing executed them until now — `testpaths = ["tests"]`, so a broken
  # example stayed green indefinitely. One did: a plugin file `.gitignore`
  # swallowed, three tests red on every clean clone since it was written.
  #
  # `--all-packages`, not `--all-extras`: the AI and plugin examples import
  # workspace packages.
  examples:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (workspace packages, not just extras)
        run: uv sync --all-packages

      - name: Run example tests
        run: uv run pytest examples/ -v

  # The functualize-mcp plugin's own suites: unit/registration tests plus the
  # examples' live-serve harnesses. The root `testpaths = ["tests"]`
  # (pyproject.toml) never collects plugin tests, and the grouped-job serve
  # crash (F1, `fix/mcp-server-fixes`) shipped precisely because no check ran
  # a live serve. The capability tests in
  # plugins/functualize-mcp/tests/test_live_serve.py and the grouped_tools
  # example harness are the regression net for it; this job is what keeps
  # that net running.
  plugin-mcp:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies (workspace packages, not just extras)
        run: uv sync --all-packages

      - name: Run functualize-mcp plugin tests
        run: uv run pytest plugins/functualize-mcp/tests -q

      - name: Run functualize-mcp examples
        run: uv run pytest plugins/functualize-mcp/examples -v

  # Every example command this repository publishes, run from a CLEAN CLONE.
  #
  # This closes a class the other jobs structurally cannot see. `055310b` and
  # `7f09be4` were both files that existed on the author's disk and not in git:
  # a plugin implementation, then the config anchor that made the example
  # discoverable. Every job above checks out the working tree and then runs in
  # it, so an untracked file is present for all of them and absent for every
  # user. Both defects were green in CI and broken on `git clone`.
  #
  # `git clone` is the whole mechanism — it copies tracked files only, so a file
  # git never knew about simply is not there. Nothing else in this workflow has
  # that property.
  #
  # Deliberately narrow: the two examples whose READMEs publish a single
  # self-contained command. Widening it to all 20 is worth doing and is a
  # separate change — a guard that is hard to keep green stops being run.
  clean-clone-examples:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git clone` below needs real history, not a tarball export.
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Clone tracked files only
        run: git clone --no-hardlinks . "$RUNNER_TEMP/clean"

      - name: Install dependencies in the clone
        working-directory: ${{ runner.temp }}/clean
        run: uv sync --all-packages --all-extras

      # The README publishes exactly one command for this example. It failed
      # with "Unknown command 'greet'" on a clean clone twice.
      # Both streams are captured on purpose. A job's `rc.log(...)` goes to
      # stderr and a plugin's `print()` to stdout, so a stdout-only capture
      # silently drops half of what these commands publish — the showcase
      # assertion below is a `rc.log` line and never appears on stdout at all.
      - name: file_based_plugin — the command its README publishes
        working-directory: ${{ runner.temp }}/clean/examples/plugins/file_based_plugin
        run: |
          set -euo pipefail
          out=$("$RUNNER_TEMP/clean/.venv/bin/func" greet 2>&1)
          echo "$out"
          echo "$out" | grep -q "\[run-notifier\] greet succeeded."

      - name: showcase — the first command its README publishes
        working-directory: ${{ runner.temp }}/clean/examples/standalone/showcase
        run: |
          set -euo pipefail
          out=$("$RUNNER_TEMP/clean/.venv/bin/func" scripts/hello.py greet --name World 2>&1)
          echo "$out"
          echo "$out" | grep -q "Hello, World!"

  # Runs the commands the documentation tells a reader to run, and compares the
  # output against what the docs claim. Shell-engine scenarios only: docker
  # steps run full `pip install` cycles and pty steps drive a real terminal,
  # and `CLAUDE.md` forbids wiring `observe-tui` into CI. Those belong to the
  # release pass.
  #
  # Two preconditions, both of which turn into false doc failures when missed:
  # `.venv/bin` on PATH (or every step exits 127) and the working directory at
  # the repository root (a shell step's `cwd` is process-relative).
  #
  # Fails on ANY non-zero exit. `run-scenario` returns 1 for a failed step and
  # 2 for a scenario it could not load, so gating on 2 alone would pass every
  # real documentation failure through.
  #
  # `--allow-skips` is the deliberate acknowledgement that this job does NOT
  # verify the docker and pty scenarios — 10 of 16, covering installation,
  # scaffold, quickstart, discovery, MCP and the whole TUI surface. Without the
  # flag the run exits 3, because a scenario filtered out by `--engine` runs
  # zero steps and verifies nothing; reporting that as a pass is what let the
  # narrowing go unnoticed. The runner prints every unverified scenario and the
  # tier that owes it, so removing this flag is how you see the gap again.
  # The only owner those tiers actually have today is the manual release gate
  # (`.agents/skills/release/SKILL.md` Phase 4). No scheduled workflow exists.
  doc-verify:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      # `--all-packages` as well as `--all-extras`: the two prune each other,
      # and `--all-extras` alone installs no workspace member. The shell
      # scenarios import none today, so this was green by luck — the first one
      # to touch an AI or plugin example would have failed on a missing
      # package and been reported as documentation drift, which is the one
      # thing this job must never do. (.spec/STATUS.md finding 11.)
      #
      # `--group docs` is deliberately not here: no scenario runs mkdocs, and
      # the `docs-build` job below owns `mkdocs build --strict` with that group
      # synced. A local run of the whole suite still needs all three at once,
      # as the skill's precondition says.
      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Verify documented commands still behave as documented
        run: |
          PATH="$PWD/.venv/bin:$PATH" python \
            .agents/skills/doc-verify/scripts/run-scenario \
            examples/docs/scenarios/ --engine shell --allow-skips

  # `mkdocs build --strict` ran only on push to master (`docs.yml`), so a PR
  # could break the docs build and only be caught after merge.
  #
  # `--group docs`, not `--all-extras`: mkdocs is not an extra, and a job
  # copying its neighbours here fails on a missing `mkdocs` executable.
  docs-build:
    needs: spec-only-change
    if: (!cancelled()) && needs.spec-only-change.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install documentation dependencies
        run: uv sync --group docs

      - name: Build documentation
        run: uv run mkdocs build --strict

  # Full suite: property tests + coverage + multi-version + parallel.
  # Thorough validation, runs alongside test-fast.
  test-full:
    needs: spec-only-change
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Skip validated suite for final spec cleanup
        if: needs.spec-only-change.outputs.skip == 'true'
        run: echo "Prior PR validation was green; skipping the unchanged full suite for Python ${{ matrix.python-version }}."

      - uses: actions/checkout@v4
        if: needs.spec-only-change.outputs.skip != 'true'

      - name: Install uv
        if: needs.spec-only-change.outputs.skip != 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        if: needs.spec-only-change.outputs.skip != 'true'
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        if: needs.spec-only-change.outputs.skip != 'true'
        run: uv sync --all-extras

      - name: Run full test suite (property tests + coverage, parallel)
        if: needs.spec-only-change.outputs.skip != 'true'
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest --run-slow --cov=functualize --cov-report=xml -n auto

      - name: Upload coverage
        if: needs.spec-only-change.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  # Feature artifacts under .spec/features/ are committed on the branch so the
  # spec, contracts, plan and task ledger are reviewable, then cleared before
  # merge so master carries none of them. This job is what makes that binding.
  #
  # It runs on pull_request AND on push to master, so the single job is both the
  # blocking PR check and the post-merge master guard. No sparse-checkout:
  # `git ls-files` needs a real index.
  #
  # Deliberately NOT gated by spec-only-change: the clearing push is the one
  # push whose whole content is this job's subject, so skipping it there would
  # skip the only run that ever has something to say.
  #
  # It IS a required context in the `master` ruleset, so a red tick here blocks
  # the merge — which is what .spec/CONSTITUTION.md's tracking exception is
  # granted on the condition of, and what AGENTS.md, .claude/rules/spec-workflow.md,
  # .claude/commands/agentic-verify.md and .claude/agents/spec-driven-developer.md
  # all describe. It was NOT required until 2026-09-09; those five documents
  # asserted a guarantee nothing enforced. Dropping it from the ruleset puts
  # them back to being wrong.
  spec-artifacts-cleared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert .spec/features/ is cleared
        run: |
          tracked=$(git ls-files .spec/features/)
          if [ -n "$tracked" ]; then
            echo "::error::.spec/features/ still has tracked files. Migrate the durable half to .spec/STATUS.md or contributor/adr/, then 'git rm -r .spec/features/<name>' before merging."
            echo "$tracked"
            exit 1
          fi
          echo "OK: .spec/features/ carries no tracked files."

  # An honoured `.spec/EXEMPT` writes nothing to the repository, so the only
  # durable receipt for a spec-workflow bypass is a `Spec-exempt:` line in the
  # pull request body. This job validates that such a declaration is well formed
  # and republishes it in the run summary.
  #
  # It deliberately always materializes: a required check that never runs leaves
  # GitHub waiting for a status that cannot arrive. It does not decide whether
  # an exemption was owed; that remains a self-reported reviewer-facing receipt.
  spec-exemption-declared:
    runs-on: ubuntu-latest
    steps:
      - name: Validate any Spec-exempt declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Not a pull request; no PR body to check."
            exit 0
          fi

          declarations=$(printf '%s\n' "${PR_BODY:-}" | tr -d '\r' \
            | grep -E '^[[:space:]]*Spec-exempt:' || true)

          if [ -z "$declarations" ]; then
            echo "No Spec-exempt declaration in this PR body."
            exit 0
          fi

          status=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            reason=$(printf '%s' "$line" | sed -E 's/^[[:space:]]*Spec-exempt:[[:space:]]*//')
            if [ "${#reason}" -lt 20 ]; then
              echo "::error::Spec-exempt reason is ${#reason} characters; at least 20 are required: $line"
              status=1
            else
              echo "Declared bypass: $reason"
              echo "- \`Spec-exempt:\` $reason" >> "$GITHUB_STEP_SUMMARY"
            fi
          done <<< "$declarations"

          exit "$status"
