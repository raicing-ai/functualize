name: PR Title

# The repo squash-merges with squash_merge_commit_title=PR_TITLE, so the PR
# title becomes the commit subject on master verbatim. This lints it against
# the same type list as the commit-msg hook in .pre-commit-config.yaml — the
# hook cannot see the title, and the title is what actually lands.
#
# Deliberately `pull_request`, not `pull_request_target`: this only needs to
# read a title, and pull_request_target would run with a write-scoped token in
# the context of the base repo for fork PRs. A failing job is enough signal.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            test
            perf
            ci
            build
            chore
            revert
          # Scope is optional, but when present it must be a single lowercase
          # token — `fix(engine):`, never `fix(cli,scaffold):`.
          requireScope: false
          scopes: |
            [a-z0-9-]+
          # Subject: imperative, lowercase, no trailing period.
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" in "{title}" is invalid.

            It must start lowercase and must not end with a period, e.g.
              feat(tui): render group flags mid-path

            See CONTRIBUTING.md § Commit Message Convention.
